name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Package publisher reserved in Microsoft Partner Center.  The Store signs
  # the package itself, so the Store package is not signed here.
  STORE_PUBLISHER: CN=4D7AE54D-4897-4AAF-AD4A-96A83C99020F

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]      # arm64: cross-compiled on the x64 runner

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Build
      # build.ps1 finds Visual Studio and sets up its environment.
      shell: powershell
      run: .\build.ps1 -Arch ${{ matrix.arch }} -NoPackage

    - name: Version
      shell: powershell
      run: |
        # v1.2.3 tag -> 1.2.3.0, otherwise <VERSION file>.<run number>.
        # The Store requires the last number to be 0: only tags go there.
        if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v(\d+)\.(\d+)\.(\d+)$') {
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          "STORE=1" >> $env:GITHUB_ENV
        } else {
          $version = "$((Get-Content -Raw VERSION).Trim()).${{ github.run_number }}"
        }
        "VERSION=$version" >> $env:GITHUB_ENV

    - name: Package
      shell: powershell
      env:
        # Optional signing certificate: base64 of the .pfx, its password and
        # its exact subject.  Without it, a test certificate is used.
        SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
        SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        SIGNING_PUBLISHER: ${{ secrets.SIGNING_PUBLISHER }}
      run: |
        $version = $env:VERSION
        if ($env:SIGNING_PFX) {
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          .\make_package.ps1 -Version $version -Arch ${{ matrix.arch }} `
            -Publisher $env:SIGNING_PUBLISHER -PfxPath $pfx -PfxPassword $env:SIGNING_PFX_PASSWORD
          Remove-Item $pfx
        } else {
          .\make_package.ps1 -Version $version -Arch ${{ matrix.arch }} -TestCert
        }

    - uses: actions/upload-artifact@v7.0.2
      with:
        name: OpenInVim-${{ matrix.arch }}
        path: out/*

    - name: Store package
      if: env.STORE == '1'
      shell: powershell
      run: .\make_package.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }} -Publisher $env:STORE_PUBLISHER -OutDir out\store

    - uses: actions/upload-artifact@v7.0.2
      if: env.STORE == '1'
      with:
        name: store-${{ matrix.arch }}
        path: out/store/*.msix

  store:
    # Unsigned bundle of all architectures, to upload to Partner Center.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: actions/download-artifact@v8.0.2
      with:
        pattern: store-*
        path: out/store
        merge-multiple: true

    - name: Bundle
      shell: powershell
      run: |
        $msix = Get-ChildItem out\store\*.msix | Select-Object -First 1
        if ($msix.Name -notmatch '^OpenInVim_([\d.]+)_') { throw "Unexpected $($msix.Name)" }
        .\make_bundle.ps1 -Version $Matches[1] -InDir out\store

    - uses: actions/upload-artifact@v7.0.2
      with:
        name: store-bundle
        path: out/*.msixbundle

  release:
    # The packages are only signed with a test certificate: OpenInVim is
    # distributed by the Microsoft Store.  Set the repository variable
    # GITHUB_RELEASE to true to publish them in a GitHub release anyway.
    if: github.ref_type == 'tag' && vars.GITHUB_RELEASE == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8.0.2
      with:
        pattern: OpenInVim-*
        path: out
        merge-multiple: true

    - uses: softprops/action-gh-release@v3.0.3
      with:
        files: out/*
